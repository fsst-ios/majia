name: Photo iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/photo/**'
      - '.github/workflows/photo-ios-ci.yml'
  pull_request:
    paths:
      - 'apps/photo/**'
      - '.github/workflows/photo-ios-ci.yml'

permissions:
  contents: read

concurrency:
  group: photo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/photo
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Record toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub
